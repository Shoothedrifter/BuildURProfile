<?xml version="1.0" encoding="UTF-8"?>
<!-- 暖调马卡龙模板的原创默认形象：抽象柔和插画，非真人、非 Wibi 资源；自包含矢量，可 base64 内嵌导出。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="macaron-default-title">
  <title id="macaron-default-title">暖调马卡龙默认形象</title>
  <desc>拱形花窗内安睡的猫、满月与云，窗台上叠着马卡龙与一株绿植的柔和插画。</desc>
  <defs>
    <linearGradient id="macaron-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FED2BC"/>
      <stop offset="0.55" stop-color="#E8C4C4"/>
      <stop offset="1" stop-color="#E0A6B5"/>
    </linearGradient>
    <linearGradient id="macaron-pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF3F6"/>
      <stop offset="1" stop-color="#FBE9DC"/>
    </linearGradient>
  </defs>

  <!-- 渐变底与柔光圆 -->
  <rect width="480" height="640" fill="url(#macaron-bg)"/>
  <circle cx="376" cy="128" r="72" fill="#DEEDC3" opacity="0.5"/>
  <circle cx="88" cy="520" r="64" fill="#D0E3EB" opacity="0.45"/>

  <!-- 拱形花窗：外框、内线与窗棂 -->
  <path d="M116 536 V256 a124 124 0 0 1 248 0 V536 Z" fill="url(#macaron-pane)" stroke="#B5828C" stroke-width="10" stroke-linejoin="round"/>
  <path d="M132 536 V256 a108 108 0 0 1 216 0 V536" fill="none" stroke="#B5828C" stroke-width="3" opacity="0.35"/>
  <path d="M240 396 V148" stroke="#B5828C" stroke-width="6" opacity="0.55" stroke-linecap="round"/>
  <path d="M132 396 H348" stroke="#B5828C" stroke-width="6" opacity="0.55" stroke-linecap="round"/>

  <!-- 窗内：满月、星点与云 -->
  <circle cx="300" cy="210" r="44" fill="#DEEDC3" opacity="0.35"/>
  <circle cx="300" cy="210" r="30" fill="#B5D0D9"/>
  <path d="M360 158 v20 M350 168 h20" stroke="#FED2BC" stroke-width="4" stroke-linecap="round"/>
  <path d="M186 186 v14 M179 193 h14" stroke="#E0A6B5" stroke-width="3.5" stroke-linecap="round"/>
  <g fill="#FFFFFF" opacity="0.55">
    <circle cx="172" cy="246" r="12"/>
    <circle cx="190" cy="242" r="10"/>
    <ellipse cx="182" cy="252" rx="34" ry="13"/>
  </g>

  <!-- 窗台上安睡的猫（原创剪影角色） -->
  <g>
    <path d="M286 532 C306 528 310 504 297 495" fill="none" stroke="#4A3840" stroke-width="12" stroke-linecap="round"/>
    <path d="M194 536 C191 492 210 460 240 460 C270 460 289 492 286 536 Z" fill="#4A3840"/>
    <path d="M219 432 L213 402 L240 419 Z M261 432 L267 402 L240 419 Z" fill="#4A3840"/>
    <path d="M222 427 L219 412 L231 420 Z M258 427 L261 412 L249 420 Z" fill="#E8C4C4"/>
    <circle cx="240" cy="448" r="33" fill="#4A3840"/>
    <path d="M227 450 q6 5 12 0 M253 450 q6 5 12 0" fill="none" stroke="#FED2BC" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="240" cy="459" r="2.5" fill="#E0A6B5"/>
    <circle cx="217" cy="464" r="5" fill="#E8C4C4"/>
    <circle cx="263" cy="464" r="5" fill="#E8C4C4"/>
    <path d="M228 536 v-10 M252 536 v-10" stroke="#70565F" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 窗台左段：叠起的马卡龙 -->
  <g>
    <g transform="translate(128 508)">
      <path d="M0 0 a26 18 0 0 1 52 0 Z" fill="#E0A6B5"/>
      <rect x="-2" y="0" width="56" height="7" rx="3.5" fill="#FFF7EE"/>
      <path d="M52 10 a26 18 0 0 1 -52 0 Z" fill="#E0A6B5"/>
    </g>
    <g transform="translate(128 478)">
      <path d="M0 0 a26 18 0 0 1 52 0 Z" fill="#B5D0D9"/>
      <rect x="-2" y="0" width="56" height="7" rx="3.5" fill="#FFF7EE"/>
      <path d="M52 10 a26 18 0 0 1 -52 0 Z" fill="#B5D0D9"/>
    </g>
    <g transform="translate(128 448)">
      <path d="M0 0 a26 18 0 0 1 52 0 Z" fill="#FED2BC"/>
      <rect x="-2" y="0" width="56" height="7" rx="3.5" fill="#FFF7EE"/>
      <path d="M52 10 a26 18 0 0 1 -52 0 Z" fill="#FED2BC"/>
    </g>
  </g>

  <!-- 窗台右段：小绿植 -->
  <g>
    <ellipse cx="344" cy="466" rx="12" ry="6" fill="#A9C9AF" transform="rotate(24 344 466)"/>
    <ellipse cx="316" cy="478" rx="12" ry="6" fill="#8FB89B" transform="rotate(-28 316 478)"/>
    <path d="M330 506 C328 486 332 470 330 452" fill="none" stroke="#7FA98C" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="330" cy="446" rx="8" ry="11" fill="#DEEDC3"/>
    <path d="M320 536 l-4 -24 h28 l-4 24 Z" fill="#B5828C"/>
    <rect x="310" y="504" width="40" height="8" rx="4" fill="#9C6F78"/>
  </g>

  <!-- 窗台与地面 -->
  <rect x="96" y="536" width="288" height="18" rx="9" fill="#B5828C" opacity="0.8"/>
  <rect x="84" y="554" width="312" height="10" rx="5" fill="#B5828C" opacity="0.35"/>
  <ellipse cx="240" cy="588" rx="190" ry="26" fill="#DEEDC3" opacity="0.5"/>
  <ellipse cx="240" cy="590" rx="120" ry="14" fill="#D0E3EB" opacity="0.35"/>

  <!-- 漂浮的柔和圆点 -->
  <circle cx="110" cy="300" r="7" fill="#DEEDC3" opacity="0.55"/>
  <circle cx="382" cy="340" r="6" fill="#B5D0D9" opacity="0.5"/>
  <circle cx="132" cy="160" r="5" fill="#E8C4C4" opacity="0.6"/>
  <circle cx="366" cy="452" r="5" fill="#FED2BC" opacity="0.6"/>
</svg>

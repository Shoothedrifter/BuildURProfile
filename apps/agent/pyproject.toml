[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "buildurprofile-agent"
version = "0.1.0"
description = "Private LangGraph worker for BuildURProfile"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "openai>=2,<4",
  "pydantic>=2.10,<3",
  "Pillow>=11,<13",
  "uvicorn>=0.34,<1",
  "cloudflare>=5,<7",
  "pdfplumber>=0.11,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[project.scripts]
buildurprofile-agent = "buildurprofile_agent.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"

name: buildurprofile-frpc

services:
  frpc:
    image: snowdreamtech/frpc:latest
    container_name: frpc
    restart: unless-stopped

    network_mode: host

    environment:
      FRPS_SERVER_ADDR: "${FRPS_SERVER_ADDR:?FRPS_SERVER_ADDR is required}"
      FRPS_SERVER_PORT: "${FRPS_SERVER_PORT:-7000}"
      FRPS_TOKEN: "${FRPS_TOKEN:?FRPS_TOKEN is required}"

      FRPC_REMOTE_PORT: "${FRPC_REMOTE_PORT:-3000}"
      LOCAL_BIND_ADDR: "${LOCAL_BIND_ADDR:-127.0.0.1}"
      LOCAL_APP_PORT: "${LOCAL_APP_PORT:-3000}"

      TZ: Asia/Shanghai

    configs:
      - source: frpc_config
        target: /etc/frp/frpc.toml
        mode: 0444

configs:
  frpc_config:
    content: |
      serverAddr = "{{ .Envs.FRPS_SERVER_ADDR }}"
      serverPort = {{ .Envs.FRPS_SERVER_PORT }}

      loginFailExit = true

      transport.tls.enable = true

      auth.method = "token"
      auth.token = "{{ .Envs.FRPS_TOKEN }}"

      [[proxies]]
      name = "mywebapp-local"
      type = "tcp"

      localIP = "{{ .Envs.LOCAL_BIND_ADDR }}"
      localPort = {{ .Envs.LOCAL_APP_PORT }}

      remotePort = {{ .Envs.FRPC_REMOTE_PORT }}

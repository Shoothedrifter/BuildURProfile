name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: buildurprofile_ci
          POSTGRES_USER: buildurprofile_ci
          POSTGRES_PASSWORD: ci-ephemeral
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U buildurprofile_ci -d buildurprofile_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://buildurprofile_ci:ci-ephemeral@127.0.0.1:5432/buildurprofile_ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install uv==0.11.12
      - run: uv lock --check --project apps/agent
      - run: uv sync --project apps/agent --frozen --extra test
      - run: npm run build
      - run: npm test
      - run: npm run test:payment
      - run: npm run test:skills
      - run: npm run test:agent
      - run: docker build -f apps/launcher/Dockerfile -t buildurprofile-web:ci .
      - run: docker build -f apps/agent/Dockerfile -t buildurprofile-agent:ci .

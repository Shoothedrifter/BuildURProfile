name: buildurprofile-agent

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env}
      POSTGRES_WEB_PASSWORD: ${POSTGRES_WEB_PASSWORD:?set POSTGRES_WEB_PASSWORD in .env}
      POSTGRES_CHECKPOINT_PASSWORD: ${POSTGRES_CHECKPOINT_PASSWORD:?set POSTGRES_CHECKPOINT_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/01-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    networks: [private]

  web-api:
    build:
      context: .
      dockerfile: apps/launcher/Dockerfile
    env_file:
      - .env.api
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8787
      DATABASE_URL: postgresql://buildurprofile_web:${POSTGRES_WEB_PASSWORD:?set POSTGRES_WEB_PASSWORD in .env}@postgres:5432/buildurprofile
      DATABASE_SCHEMA: public
      AVATAR_ASSET_ROOT: /app/data/avatar-assets
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:?set AGENT_SERVICE_TOKEN in .env}
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks: [private, egress]

  agent:
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    env_file:
      - .env.agent
    environment:
      AGENT_API_URL: http://web-api:8787
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:?set AGENT_SERVICE_TOKEN in .env}
      AGENT_CHECKPOINT_DATABASE_URL: postgresql://buildurprofile_checkpoint:${POSTGRES_CHECKPOINT_PASSWORD:?set POSTGRES_CHECKPOINT_PASSWORD in .env}@postgres:5432/buildurprofile_checkpoints
      AGENT_CHECKPOINT_SCHEMA: public
    depends_on:
      web-api:
        condition: service_healthy
    restart: unless-stopped
    networks: [private, egress]

networks:
  private:
    internal: true
  egress: {}

volumes:
  app_data:
  postgres_data:
